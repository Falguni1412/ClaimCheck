apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimcheck-backend
  labels:
    app: claimcheck
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claimcheck
      component: backend
  template:
    metadata:
      labels:
        app: claimcheck
        component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/falgunitimande72/claimcheck-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: claimcheck-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://claimcheck-redis:6379/0"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: claimcheck-secrets
                  key: jwt-secret
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claimcheck-backend-svc
spec:
  selector:
    app: claimcheck
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claimcheck-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claimcheck-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
