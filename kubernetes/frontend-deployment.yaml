apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimcheck-frontend
  labels:
    app: claimcheck
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claimcheck
      component: frontend
  template:
    metadata:
      labels:
        app: claimcheck
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/falgunitimande72/claimcheck-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://claimcheck-backend-svc:8000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claimcheck-frontend-svc
spec:
  selector:
    app: claimcheck
    component: frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
