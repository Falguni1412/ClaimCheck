services:
  # Backend FastAPI Service (Free Tier)
  - type: web
    name: claimcheck-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_QUANTIZATION
        value: "true"
      - key: LOG_LEVEL
        value: INFO

  # Frontend Next.js Service (Free Tier)
  - type: web
    name: claimcheck-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: claimcheck-backend
          property: url
