apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claimcheck-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - claimcheck.example.com
      secretName: claimcheck-tls
  rules:
    - host: claimcheck.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: claimcheck-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claimcheck-frontend-svc
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claimcheck-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  CACHE_TTL: "3600"
  RATE_LIMIT_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: claimcheck-secrets
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://user:pass@host:5432/claimcheck"
  jwt-secret: "REPLACE_WITH_LONG_RANDOM_STRING"
